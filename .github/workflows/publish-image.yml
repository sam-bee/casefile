name: Publish Casefile image

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test Go service
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE/service:/src:ro" \
            --workdir /src golang:1.25-alpine go test ./...

      - name: Build image
        run: |
          docker build --platform linux/amd64 --provenance=false \
            --tag "ghcr.io/sam-bee/nightwatch-casefile:$GITHUB_SHA" .

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: docker push "ghcr.io/sam-bee/nightwatch-casefile:$GITHUB_SHA"
