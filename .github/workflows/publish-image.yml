name: Publish Casefile image

on:
  push:
    branches:
      - master

concurrency:
  group: publish-casefile-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test Go service
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE/service:/src:ro" \
            --workdir /src golang:1.25-alpine go test ./...

      - name: Build image
        run: |
          docker build --platform linux/amd64 --provenance=false \
            --tag "ghcr.io/sam-bee/nightwatch-casefile:$GITHUB_SHA" \
            --tag "ghcr.io/sam-bee/nightwatch-casefile:latest" .

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: |
          docker push "ghcr.io/sam-bee/nightwatch-casefile:$GITHUB_SHA"
          docker push "ghcr.io/sam-bee/nightwatch-casefile:latest"
